name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The frontend builds first and hands web/build to the Go job as an artifact.
  # That ordering isn't a preference: web/dist.go does `//go:embed all:build`,
  # so `go build` fails outright until web/build exists.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build

  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build
      # The embed matches web/build/index.html and nothing else, so a
      # round-trip that nests the artifact one level deeper compiles into a
      # binary that 404s every asset. Fail here instead.
      - name: Check the artifact landed at web/build/index.html
        run: test -f web/build/index.html
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
